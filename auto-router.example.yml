# auto-router 示例配置（OMP 与 Pi 共用同一份配置格式）
# OMP:复制到 ~/.omp/agent/auto-router.yml;项目级覆盖放 <repo>/.omp/auto-router.yml
# Pi: 复制到 ${PI_CODING_AGENT_DIR:-~/.pi/agent}/auto-router.yml;项目级覆盖放 <repo>/.pi/auto-router.yml(仅 trusted project 生效)
# 注意:下面的 provider/model 均为示例,必须替换成你的宿主模型注册表中真实存在的组合;
# Pi 启用 scoped models(enabledModels / --models)时,虚拟 auto-router/* 与这里的真实 targets 都要包含在 scope 内。

active: premium

profiles:
  premium:
    description: 日常开发，订阅额度优先
    defaultTier: standard
    tiers:
      trivial:
        thinking: low
        targets:
          - { provider: deepseek, model: deepseek-v4-flash, billing: per-token }
          - { provider: ollama, model: glm-5.1:cloud }
      simple:
        thinking: low
        targets:
          - { provider: deepseek, model: deepseek-v4-flash, billing: per-token }
      standard:
        thinking: medium
        targets:
          - { provider: anthropic, model: claude-sonnet-4-5 }
          - { provider: openai-codex, model: gpt-5.5 }
          - { provider: google, model: gemini-3.1-pro, billing: per-token }
      complex:
        thinking: high
        targets:
          - { provider: anthropic, model: claude-opus-4-5 }
          - { provider: google, model: gemini-3.1-pro, billing: per-token }
    # 角色路由（可选）：omp modelRoles 指向 auto-router/premium/<role> 生效。
    # 固定链（targets）跳过分类；tierFloor/tierCap 为分类结果钳界；钉层永远可逃逸。
    roles:
      task:   # 子代理固定走便宜链，零分类开销
        thinking: low
        targets:
          - { provider: deepseek, model: deepseek-v4-flash, billing: per-token }
      smol: { tierCap: simple }      # 标题/记忆等轻量任务：照常分类但封顶 simple
      slow: { tierFloor: complex }   # 慢速深思考角色：保底 complex
    budgets:
      google: { amount: 20, monthly: true }
    rules:
      - type: exclude-provider
        providers: [google]
        when: { hourStart: 23, hourEnd: 7 }   # 夜间优先省配额
  economy:
    description: 省钱模式
    defaultTier: standard
    tiers:
      standard:
        thinking: low
        targets:
          - { provider: deepseek, model: deepseek-v4-flash, billing: per-token }
  offline:
    description: 纯本地
    defaultTier: standard
    tiers:
      standard:
        targets:
          - { provider: ollama, model: qwen3-coder }

aliases:
  eco: [economy]
  fast: [economy]

activate:
  - { path: ~/work, profile: premium }
  - { path: ~/oss, profile: economy }
